# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Reflected Cross-Site Scripting (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask form that writes the submitted text back into the page unescaped (reflected XSS). The SKF lab folder python/XSS is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-xss

networks:
  lab: { cidr: 10.60.133.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the submitted string is written back into the page
    script: checks/reflect.sh

message: |
  OWASP SKF Reflected Cross-Site Scripting answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Whatever you submit in the form comes back in the page.
