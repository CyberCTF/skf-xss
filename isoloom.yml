# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Reflected Cross-Site Scripting (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask form that writes the submitted text back into the page unescaped (reflected XSS). The SKF lab folder python/XSS is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-xss

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.133.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.lab

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the submitted string is written back into the page
    script: checks/reflect.sh

message: |
  OWASP SKF Reflected Cross-Site Scripting answers at {{ machines.web.ports.web.url }}.
  Whatever you submit in the form comes back in the page.
